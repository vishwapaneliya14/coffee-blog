<main class="auth"><div class="auth-card"><span class="eyebrow">JOIN BREWATLAS</span><h1>Create account</h1><p class="muted">Frontend demonstration account using browser storage.</p><form id="registerForm" novalidate><label>Full name<input id="regName" type="text" placeholder="Your name"></label><small id="nameError" class="error"></small><label>Email<input id="regEmail" type="email" placeholder="you@example.com"></label><small id="regEmailError" class="error"></small><label>Password<input id="regPassword" type="password" placeholder="Minimum 6 characters"></label><small id="regPasswordError" class="error"></small><label>Confirm password<input id="regConfirm" type="password" placeholder="Repeat password"></label><small id="confirmError" class="error"></small><button class="btn full" type="submit">Create Account</button><p id="registerMessage" class="success"></p></form><p>Already registered? <a href="login.html">Login</a></p></div></main><script src="js/auth.js"></script></body></html>
